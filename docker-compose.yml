version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vayora-mongodb
    restart: always
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: vayora
    volumes:
      - mongo-data:/data/db

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: vayora-server
    restart: always
    ports:
      - '5000:5000'
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/vayora
      JWT_SECRET: vayora_enterprise_production_jwt_secret_2026_9812739
      CLIENT_URL: http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: vayora-client
    restart: always
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      - server

volumes:
  mongo-data:
